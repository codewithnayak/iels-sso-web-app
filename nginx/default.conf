server {
    listen 80;

    # Redirect root to /sso
    location / {
        return 302 /sso/;
    }

    # Serve the React app under /sso
    location /sso/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /sso/index.html;
    }

    # Optional health check
    location /health {
        return 200 "OK";
    }
}
